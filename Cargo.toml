[package]
name = "runboundary"
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
description = "Fail-closed Linux and macOS filesystem sandbox for coding agents"

[lib]
path = "internal/lib.rs"

[[bin]]
name = "runb"
path = "cmd/runb/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.154"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3.27.0"
semver = "1.0"

[dev-dependencies]

